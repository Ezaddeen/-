<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">مقترح شعار بصمة الحرفيين</title>
  <desc id="description">الاسم مكتوب بخط عربي، مع خطوط بصمة منقوشة في كلمة بصمة وغرز نسيج داخل كلمة الحرفيين، بنسختين فاتحة وداكنة.</desc>
  <style>
