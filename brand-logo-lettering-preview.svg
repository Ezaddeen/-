    .wordmark { font-family: 'Aref Ruqaa', serif; font-weight: 700; }
  </style>
  <defs>
    <clipPath id="fingerprint-light"><text class="wordmark" x="300" y="320" text-anchor="middle" direction="rtl" font-size="150">بصمة</text></clipPath>
    <clipPath id="craft-light"><text class="wordmark" x="300" y="470" text-anchor="middle" direction="rtl" font-size="118">الحرفيين</text></clipPath>
    <clipPath id="fingerprint-dark"><text class="wordmark" x="900" y="320" text-anchor="middle" direction="rtl" font-size="150">بصمة</text></clipPath>
    <clipPath id="craft-dark"><text class="wordmark" x="900" y="470" text-anchor="middle" direction="rtl" font-size="118">الحرفيين</text></clipPath>
  </defs>
  <rect width="600" height="780" fill="#fbf8f0"/>
  <rect x="600" width="600" height="780" fill="#183c32"/>
  <path d="M600 0v780" stroke="#d7d1c5"/>

